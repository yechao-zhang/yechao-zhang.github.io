<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">Two gaps between recognizing risk and acting safely</title>
<desc id="desc">Two conceptual parallels: recognizing evidence when asked separately but misinterpreting it during the task; acknowledging possible harm but continuing harmful actions. This is not a measured sequence of internal stages or a diagnosis of a particular prompt-injection failure.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10" fill="none" stroke="#8a979e" stroke-width="1.5"/></marker></defs>
<rect width="960" height="580" rx="18" fill="#f5f7f8"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="36" y="54" fill="#2e3d47" font-size="29" font-weight="700">Two gaps between recognition and safety</text>
<text x="36" y="88" fill="#667680" font-size="19">Our comparison of recognition and behavior</text>
<rect x="30" y="123" width="437" height="364" rx="14" fill="#fff" stroke="#dce3e7"/>
<rect x="493" y="123" width="437" height="364" rx="14" fill="#fff" stroke="#dce3e7"/>
<text x="54" y="163" fill="#2f5d7c" font-size="19" font-weight="700">01 / RECOGNITION IN CONTEXT</text>
<text x="517" y="163" fill="#a95132" font-size="19" font-weight="700">02 / ACKNOWLEDGMENT &amp; ACTION</text>
<text x="54" y="184" fill="#536773" font-size="16">Related concern: biased reasoning</text>
<text x="517" y="184" fill="#536773" font-size="16">Related concern: recklessness</text>
<rect x="54" y="190" width="389" height="92" rx="9" fill="#edf3f7"/>
<rect x="517" y="190" width="389" height="92" rx="9" fill="#edf3f7"/>
<text x="77" y="227" fill="#2e3d47" font-size="25" font-weight="700">Recognizes the evidence</text>
<text x="77" y="258" fill="#536773" font-size="22">when asked separately</text>
<text x="540" y="227" fill="#2e3d47" font-size="23" font-weight="700">Acknowledges possible harm</text>
<text x="540" y="258" fill="#536773" font-size="22">during the actual task</text>
<path d="M248 291 V350" stroke="#8a979e" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M711 291 V350" stroke="#8a979e" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="54" y="365" width="389" height="92" rx="9" fill="#fcf1eb"/>
<rect x="517" y="365" width="389" height="92" rx="9" fill="#fcf1eb"/>
<text x="77" y="402" fill="#793f29" font-size="23" font-weight="700">Misinterprets the evidence</text>
<text x="77" y="433" fill="#793f29" font-size="25" font-weight="700">during the task</text>
<text x="540" y="402" fill="#793f29" font-size="25" font-weight="700">Continues with</text>
<text x="540" y="433" fill="#793f29" font-size="25" font-weight="700">harmful actions</text>
<text x="36" y="526" fill="#536773" font-size="20">A separate check does not establish what the model recognized during a task.</text>
<text x="36" y="554" fill="#536773" font-size="20">Conceptual parallels, not a measured sequence of internal stages.</text>
</g></svg>
